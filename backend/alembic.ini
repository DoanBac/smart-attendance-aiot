# Alembic configuration for Smart Attendance backend
# Run from /app inside the container (or from backend/ locally)

[alembic]
# Path to migration scripts, relative to this file
script_location = app/database/migrations

# Log files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Prepend sys.path entries (comma-separated)
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank here.
# env.py reads DATABASE_URL from app.config.settings at runtime,
# so we don't embed credentials in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
