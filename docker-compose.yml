services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: doanbac07
      POSTGRES_PASSWORD: "070301"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doanbac07 -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-service:
    build: ./ai-service
    ports:
      - "9000:9000"
    environment:
      MODEL_STORAGE_PATH: /app/models
      MODEL_NAME: buffalo_sc
      SERVICE_SECRET_KEY: ai-service-internal-secret-change-in-prod
      COSINE_THRESHOLD: "0.65"
    volumes:
      - insightface_models:/app/models   # share model cache với backend (nếu cần)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # InsightFace download model lần đầu mất ~2 phút

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://doanbac07:070301@postgres:5432/attendance_db
      REDIS_URL: redis://redis:6379/0
      MODEL_STORAGE_PATH: /app/models
      AI_SERVICE_URL: http://ai-service:9000
      AI_SERVICE_SECRET_KEY: ai-service-internal-secret-change-in-prod
      # Allow all origins — OK for local/demo; restrict to domain in production
      ALLOWED_ORIGINS: '["*"]'
    env_file:
      - ./backend/.env
    volumes:
      - insightface_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Trỏ vào nginx để frontend gọi API qua proxy (cùng domain → không bị CORS)
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost/ws
    depends_on:
      - backend

  # ── Nginx reverse proxy ──────────────────────────────────────────────────
  # Gom backend + frontend + websocket về 1 port (80)
  # Cloudflare Tunnel sẽ expose port 80 này ra internet
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────
  # Expose port 80 ra internet miễn phí, HTTPS tự động
  # URL sẽ hiện trong logs: docker compose logs -f cloudflared
  # Ví dụ: https://random-word-abc.trycloudflare.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  insightface_models: