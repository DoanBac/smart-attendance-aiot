services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: doanbac07
      POSTGRES_PASSWORD: "070301"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doanbac07 -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-service:
    build: ./ai-service
    ports:
      - "9000:9000"
    environment:
      MODEL_STORAGE_PATH: /app/models
      MODEL_NAME: buffalo_l        # ResNet100 ArcFace — LFW 99.83% (vs buffalo_sc 99.53%)
      SERVICE_SECRET_KEY: ai-service-internal-secret-change-in-prod
      COSINE_THRESHOLD: "0.50"     # buffalo_l is more discriminative; 0.50 safe for angled pose
    volumes:
      - insightface_models:/app/models   # share model cache với backend (nếu cần)
      - ./edge/models:/app/edge_models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 240s   # buffalo_l (~370 MB) lần đầu download lâu hơn buffalo_sc

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://doanbac07:070301@postgres:5432/attendance_db
      REDIS_URL: redis://redis:6379/0
      MODEL_STORAGE_PATH: /app/models
      AI_SERVICE_URL: http://ai-service:9000
      AI_SERVICE_SECRET_KEY: ai-service-internal-secret-change-in-prod
      # Allow all origins — OK for local/demo; restrict to domain in production
      ALLOWED_ORIGINS: '["*"]'
    env_file:
      - ./backend/.env
    volumes:
      - insightface_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Trỏ vào nginx để frontend gọi API qua proxy (cùng domain → không bị CORS)
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost/ws
    depends_on:
      - backend

  # ── Nginx reverse proxy ──────────────────────────────────────────────────
  # Gom backend + frontend + websocket về 1 port (80)
  # Cloudflare Tunnel sẽ expose port 80 này ra internet
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # ── Cloudflare Quick Tunnel (backup — URL đổi mỗi restart, dùng khi test nhanh) ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    profiles: ["cloudflare"]   # chỉ chạy khi: docker compose --profile cloudflare up

  # ── ngrok (URL cố định miễn phí — KHUYẾN NGHỊ) ───────────────────────────
  # Setup: đăng ký ngrok.com → lấy NGROK_AUTHTOKEN + NGROK_DOMAIN
  # Thêm vào file .env ở root:
  #   NGROK_AUTHTOKEN=your_token_here
  #   NGROK_DOMAIN=abc-def-xyz.ngrok-free.app
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http nginx:80 --url=${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"   # ngrok dashboard + API
    depends_on:
      - nginx
    profiles: ["ngrok"]   # chỉ chạy khi: docker compose --profile ngrok up

volumes:
  postgres_data:
  redis_data:
  insightface_models: