version: '3.8'
services:
  edge-ai:
    image: attendance-edge:latest
    build: .
    privileged: true
    volumes:
      - /dev/video0:/dev/video0          # USB camera
      - ./data:/app/data                  # SQLite local DB
      - ./config:/app/config              # device.env
      - ./models:/app/models              # ONNX models
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./config/device.env
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/video0:/dev/video0
    deploy:
      resources:
        limits:
          memory: 2G